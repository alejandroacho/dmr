apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: blackwell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-pod-manager
  namespace: blackwell
rules:
  # Manage Deployments (scale up/down inference models)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read pod status, exec into pods (for Ray management)
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Manage Services for inference model DNS
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-pod-manager-binding
  namespace: blackwell
subjects:
  - kind: ServiceAccount
    name: gateway-sa
    namespace: blackwell
roleRef:
  kind: Role
  name: gateway-pod-manager
  apiGroup: rbac.authorization.k8s.io
