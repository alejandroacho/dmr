# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Docker Compose — Blackwell Smart Gateway
#  Full configuration with all inference services.
#  Usage: docker compose up -d
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: blackwell-gateway

networks:
  blackwell_net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "9000"   # Jumbo frames
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  model_cache:
    driver: local
  triton_cache:
    driver: local
  media_output:
    driver: local
  media_input:
    driver: local
  media_assets:
    driver: local

# ──────────────────────────────────────────────────────
#  Reusable common variables
# ──────────────────────────────────────────────────────
x-gpu-common: &gpu-common
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  shm_size: "16g"
  restart: unless-stopped
  networks:
    - blackwell_net

x-model-volumes: &model-volumes
  - /home/alejandroacho/Models:/home/alejandroacho/Models:ro
  - triton_cache:/root/.triton

services:

  # ════════════════════════════════════════════════════
  #  GATEWAY — Intelligent middleware layer
  # ════════════════════════════════════════════════════
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackwell-gateway
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - MODELS_PATH=/home/alejandroacho/Models
      - SYSTEM_RAM_GB=128
      - SWAP_TIMEOUT_S=600
      - VRAM_POLL_INTERVAL_S=2.0
      - VRAM_SAFETY_MARGIN_MB=4096
      - DOCKER_SOCKET=unix:///var/run/docker.sock
      - DOCKER_NETWORK=blackwell-gateway_blackwell_net
      - LONG_POLLING_ENABLED=true
      - LONG_POLLING_TIMEOUT_S=600
      - MAX_QUEUE_SIZE=200
      - RETRY_AFTER_SECONDS=5
      - RETRY_LOG_INTERVAL_S=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/alejandroacho/Models:/home/alejandroacho/Models:ro
      - /home/alejandroacho/Server/.gateway-state:/data
    networks:
      - blackwell_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on: []  # The gateway manages containers dynamically

  # ════════════════════════════════════════════════
  #  FOCUS PROFILE — Text Models (Engineering)
  # ════════════════════════════════════════════════

  # GPT-OSS 120B — Primary reasoning model
  vllm-gpt-oss-120b:
    <<: *gpu-common
    image: vllm/vllm-openai:cu130-nightly
    container_name: vllm-gpt-oss-120b
    ports:
      - "8001:8001"
    volumes: *model-volumes
    environment:
      - MODEL_NAME=gpt-oss-120b
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_PORT=8001
      - TRITON_CACHE_DIR=/root/.triton
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model /home/alejandroacho/Models/gpt-oss-120b-q8
      --port 8001
      --tensor-parallel-size 2
      --max-model-len 128000
      --kv-cache-dtype fp8
      --quantization gptq
      --enable-prefix-caching
      --trust-remote-code
      --disable-log-requests
    profiles:
      - focus

  # Qwen 3 Coder Next 80B MoE — Secondary code model
  vllm-qwen3-coder-next-80b:
    <<: *gpu-common
    image: vllm/vllm-openai:cu130-nightly
    container_name: vllm-qwen3-coder-next-80b
    ports:
      - "8002:8002"
    volumes: *model-volumes
    environment:
      - MODEL_NAME=qwen3-coder-next-80b
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_PORT=8002
      - TRITON_CACHE_DIR=/root/.triton
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model /home/alejandroacho/Models/qwen3-coder-next-80b-q8
      --port 8002
      --tensor-parallel-size 2
      --max-model-len 128000
      --kv-cache-dtype fp8
      --quantization gptq
      --enable-prefix-caching
      --trust-remote-code
      --disable-log-requests
    profiles:
      - focus

  # ════════════════════════════════════════════════════
  #  CREATIVE PROFILE — Multimedia Models
  # ════════════════════════════════════════════════

  # Qwen 3 Coder (base) — Agent support in creative mode
  vllm-qwen3-coder:
    <<: *gpu-common
    image: vllm/vllm-openai:cu130-nightly
    container_name: vllm-qwen3-coder
    ports:
      - "8003:8003"
    volumes: *model-volumes
    environment:
      - MODEL_NAME=qwen3-coder
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_PORT=8003
      - TRITON_CACHE_DIR=/root/.triton
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model /home/alejandroacho/Models/qwen3-coder-q8
      --port 8003
      --tensor-parallel-size 2
      --max-model-len 128000
      --kv-cache-dtype fp8
      --quantization gptq
      --enable-prefix-caching
      --trust-remote-code
      --disable-log-requests
    profiles:
      - creative

  # FLUX.2 Pro — Image generation (FP16)
  comfyui-flux2-pro:
    <<: *gpu-common
    image: comfyui-flux:latest
    container_name: comfyui-flux2-pro
    ports:
      - "8004:8004"
    volumes: *model-volumes
    environment:
      - MODEL_NAME=flux2-pro
      - NVIDIA_VISIBLE_DEVICES=all
    profiles:
      - creative_image

  # LTX-Video 2 — Video generation (Q8)
  diffusers-ltx-video-2:
    <<: *gpu-common
    image: ltx-video:latest
    container_name: diffusers-ltx-video-2
    ports:
      - "8005:8005"
    volumes: *model-volumes
    environment:
      - MODEL_NAME=ltx-video-2
      - NVIDIA_VISIBLE_DEVICES=all
    profiles:
      - creative_video

  # ════════════════════════════════════════════════════
  #  MEDIA NODE (node 3) — standalone, three modalities
  #
  #  Runs alone on its own GB10: no text models, no profile swapping, no
  #  Docker socket. One ComfyUI serves all three model families and evicts
  #  between them as needed:
  #
  #    av     MiniMax-H3 (fl2va + ref2va + encoder + 2 VAEs)   ~63 GB
  #    music  ACE-Step 1.5 XL Turbo (DiT + 2 encoders + VAE)   ~20 GB
  #    image  HiDream-O1-Image (all-in-one checkpoint)          ~8 GB
  #
  #  Start:  docker compose --profile media up -d media-node media-gateway
  # ════════════════════════════════════════════════════
  media-node:
    <<: *gpu-common
    build:
      context: .
      dockerfile: Dockerfile.media
    image: media-node:latest
    container_name: media-node
    ports:
      # Published on all interfaces so the adapter can be reached directly too.
      - "8010:8010"
    volumes:
      # The whole models dir: extra_model_paths.yaml maps one entry per family.
      - /home/alejandroacho/Models:/models:ro
      - media_output:/opt/ComfyUI/output
      - media_input:/opt/ComfyUI/input
      - triton_cache:/root/.triton
    environment:
      - MODEL_NAME=media-node
      - NVIDIA_VISIBLE_DEVICES=all
      - PORT=8010
      - COMFY_URL=http://127.0.0.1:8188
      # Raise Dockerfile.media's HEALTHCHECK --start-period with this, or the
      # container reports unhealthy while it is still loading.
      - COMFY_BOOT_TIMEOUT_S=600
      # 0 = no ceiling on a generation. A 15s clip at full canvas is ~55 min,
      # so any finite value here kills long jobs after paying the GPU cost.
      # COMFY_HTTP_TIMEOUT_S still bounds each individual call to ComfyUI.
      - GENERATE_TIMEOUT_S=0
      - COMFY_HTTP_TIMEOUT_S=600
      # Generations and uploaded references are swept once they pass 24h.
      # 0 keeps everything; the volumes grow without bound if you do that.
      - MEDIA_RETENTION_HOURS=24
      - MEDIA_CLEANUP_INTERVAL_S=3600
    profiles:
      - media

  # Media-only Gateway — the public API of a standalone media node.
  #
  # Runs gateway.media_app, NOT gateway.app: the main app's startup adopts or
  # recreates VRAM profiles and force-removes "orphaned" containers, which here
  # would delete media-node itself. No Docker socket is mounted, so it could not
  # do that even if asked.
  media-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: blackwell-gateway:latest
    container_name: media-gateway
    ports:
      - "8000:8000"
    command:
      - python
      - -m
      - uvicorn
      - gateway.media_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --log-level
      - info
      - --access-log
    deploy:
      resources:
        reservations:
          devices:
            # utility only — NVML for /status/vram, no CUDA context here.
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - NODE_NAME=node3-media
      # Same compose network — reach the adapter by container name, no IP to update.
      - MEDIA_NODE_URL=http://media-node:8010
      # 0 = no ceiling. Must not be finite either, or the Gateway cuts the
      # connection mid-generation and the node cancels the job it was running.
      - MEDIA_NODE_TIMEOUT_S=0
      # Enables response_format:"url" so long clips aren't shipped as base64.
      - MEDIA_ASSET_DIR=/assets
      # The one address that must be reachable *by clients*, so it cannot use
      # the compose network name. Set MEDIA_NODE_IP in .env — switching the node
      # from WiFi to its wired 192.168.1.x address is then a one-line change.
      - MEDIA_PUBLIC_URL=http://${MEDIA_NODE_IP:-192.168.8.147}:8000
      # Saved assets are swept after 24h — so a URL handed to a client stops
      # resolving after a day. Raise it if callers revisit old results.
      - MEDIA_RETENTION_HOURS=24
      - MEDIA_CLEANUP_INTERVAL_S=3600
    volumes:
      - media_assets:/assets
    networks:
      - blackwell_net
    restart: unless-stopped
    healthcheck:
      # /health is 503 until the adapter is ready, so this has to outlast the
      # adapter's own boot (COMFY_BOOT_TIMEOUT_S=600), not just its own startup.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 660s
    # Deliberately not `condition: service_healthy`: this Gateway is meant to come
    # up first and *report* the adapter as loading, which is more useful than a
    # 10-minute silence. Nothing here needs the adapter present to start.
    depends_on:
      - media-node
    profiles:
      - media
